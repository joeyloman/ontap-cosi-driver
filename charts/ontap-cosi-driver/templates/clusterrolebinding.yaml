apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ontap-cosi-driver.fullname" . }}
  labels:
    {{- include "ontap-cosi-driver.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ontap-cosi-driver.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "ontap-cosi-driver.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
