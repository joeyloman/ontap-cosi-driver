apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ontap-cosi-driver.fullname" . }}-configuration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ontap-cosi-driver.labels" . | nindent 4 }}
data:
  config.yaml: |
    # Configuration for the ONTAP COSI driver
    mode: "{{ .Values.mode }}"
    {{- if .Values.overrideBucketID }}
    overrides:
      bucketID: "{{ .Values.overrideBucketID }}"
    {{- else }}
    overrides: {}
    {{- end }}
    errors: {}
